<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title data-i18n="page_title">Open Alpha2 — Blockly Programming</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="blockly.css">
</head>
<body class="blockly-body">

<div id="errorBanner" class="error-banner"></div>

<header class="bk-header">
  <a href="index.html" class="bk-back" data-i18n="page_back_title" data-i18n-attr="title" title="Back to control panel">←</a>
  <h1 data-i18n="page_h1">🧩 Alpha2 Blockly</h1>
  <span id="blocklyVersionBadge" class="bk-version-badge" data-i18n="page_version_badge_title" data-i18n-attr="title" title="Blockly library version (core blockly_compressed.js + standard blocks_compressed.js)"></span>
  <span class="lang-toggle bk-lang-toggle">
    <button type="button" data-ui-lang-btn="zh" onclick="setUiLanguage('zh')">中文</button>
    <button type="button" data-ui-lang-btn="en" onclick="setUiLanguage('en')">English</button>
  </span>
  <div class="bk-header-status">
    <span id="wsStatusDot" class="run-status-dot idle"></span>
    <span id="wsStatusText" data-i18n="page_ws_disconnected">WebSocket: disconnected</span>
  </div>
</header>

<div class="bk-toolbar">
  <div class="bk-toolbar-group">
    <button id="runBtn" class="bk-btn bk-btn-primary" onclick="AlphaBlockly.run()" data-i18n="page_run_btn">▶ Run</button>
    <button id="stopBtn" class="bk-btn bk-btn-danger" onclick="AlphaBlockly.stop()" disabled data-i18n="page_stop_btn">⏹ Stop</button>
    <span id="runStatusDot" class="run-status-dot idle"></span>
    <span id="runStatusText" data-i18n="page_run_status_idle">Idle</span>
  </div>

  <div class="bk-toolbar-group">
    <input id="saveNameInput" class="bk-input" placeholder="Program name" data-i18n="page_save_name_placeholder" data-i18n-attr="placeholder" style="width:120px">
    <button class="bk-btn" onclick="doSaveNamed()" data-i18n="page_save_btn">💾 Save</button>
    <select id="savedProgramSelect" class="bk-input"></select>
    <button class="bk-btn" onclick="doLoadNamed()" data-i18n="page_load_btn">📂 Load</button>
    <button class="bk-btn bk-btn-danger-outline" onclick="doDeleteNamed()" data-i18n="page_delete_btn">🗑 Delete</button>
  </div>

  <div class="bk-toolbar-group">
    <button class="bk-btn" onclick="AlphaBlockly.exportXmlFile()" data-i18n="page_export_btn">⬇ Export .xml</button>
    <label class="bk-btn bk-btn-file">
      <span data-i18n="page_import_btn">⬆ Import .xml</span>
      <input type="file" id="importFileInput" accept=".xml" style="display:none" onchange="onImportFile(this)">
    </label>
    <button class="bk-btn bk-btn-danger-outline" onclick="onClearWorkspace()" data-i18n="page_clear_workspace_btn">🧹 Clear workspace</button>
  </div>
</div>

<div class="bk-main">
  <div id="blocklyDiv" class="bk-canvas"></div>

  <div class="bk-side" id="bkSide">
    <!-- 2026-09: sidebar collapse button — expanded and collapsed states use one 32x32
      floating button (when expanded it straddles the canvas and panel edge, and the 32px
      gutter strip is gone). The arrow rotates by pure CSS with .bk-side-collapsed. -->
    <div class="bk-side-trigger" id="bkSideTrigger" onclick="toggleSidePanel()"
      data-i18n="page_side_toggle_title" data-i18n-attr="title" title="Collapse/expand the run log panel">
      <svg viewBox="0 0 8 16" width="8" height="16"><path d="M7 1L1 8l6 7"/></svg>
    </div>
    <div class="bk-side-body">
    <div class="bk-side-header">
      <h2 data-i18n="page_run_log_title">Run log</h2>
      <div class="row">
        <button class="bk-btn bk-btn-small" onclick="document.getElementById('runLog').innerHTML=''" data-i18n="page_clear_log_btn">Clear</button>
        <label class="bk-small-label"><input type="checkbox" id="runAutoScroll" checked> <span data-i18n="page_auto_scroll_label">Auto-scroll</span></label>
      </div>
    </div>
    <pre id="runLog" class="run-log"></pre>
    </div>
  </div>
</div>

<script src="blockly_compressed.js"></script>
<script src="blocks_compressed.js"></script>
<script src="blockly_msg_zh-hant.js"></script>
<script>
  // The two built-in Blockly msg files (zh-hant/en) both write straight into
  // Blockly.Msg and leave no separate dictionary for later switching. So here, after
  // zh-hant loads and before en loads, take a snapshot. blockly-i18n.js can then
  // switch between the two at runtime (see the comment at the top of blockly-i18n.js).
  window.__ALPHA_BLOCKLY_MSG_ZH = Object.assign({}, Blockly.Msg);
</script>
<script src="blockly_msg_en.js"></script>
<script>
  window.__ALPHA_BLOCKLY_MSG_EN = Object.assign({}, Blockly.Msg);
</script>
<script src="blockly-i18n.js"></script>
<script src="blockly-blocks-i18n-data.js"></script>
<script src="blockly-actions-data.js"></script>
<script src="blockly-servo-data.js"></script>
<script src="blockly-ringtone-data.js"></script>
<script src="blockly-blocks.js"></script>
<script src="blockly-toolbox.js"></script>
<script src="blockly-run.js"></script>
<script src="blockly-page.js"></script>
<!-- Typed API client (same as index.html: load it only after blockly-page.js, which provides window.api) -->
<script src="api-client.js"></script>
</body>
</html>
