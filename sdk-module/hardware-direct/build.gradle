plugins {
    id 'com.android.library'
}

android {
    // AGP 4.2.2 has no namespace DSL (added in 7.0+); package is provided by
    // src/main/AndroidManifest.xml.
    compileSdkVersion 25

    buildFeatures {
        aidl true
    }

    defaultConfig {
        minSdkVersion 19
        versionCode 1
        versionName "1.0-direct"

        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // 2026-09: the dependency on ubtechalpha2robot has been removed (the module
    // has been deleted; StaticValue/DeveloperPacketData has been moved into this
    // module). Zero project dependencies.
}
