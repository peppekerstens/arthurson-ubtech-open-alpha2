# MCP <-> OpenAPI declaration source (v2, for auto-generation, one of the single sources of truth)
# Sources:
#   - MCP tool definitions: XiaozhiBridge.java xiaozhiMcpBridge() listTools()/callTool()
#     now all auto-generated: inputSchema is built by scripts/generate-mcp-tools.py
#     reading this file + openapi/open-alpha2-openapi.yml
#     app/src/main/java/com/open/alpha2/McpToolsGenerated.java,
#     XiaozhiBridge.listTools() only does the enable/disable filtering, no hand-written org.json.
#   - OpenAPI definition: openapi/open-alpha2-openapi.yml
# Purpose: make sure LLM calls over MCP and direct HTTP calls use the same validation (ApiValidator.java + api-client.js)
# Regenerate:
#   python scripts/generate-mcp-tools.py
#   python scripts/generate-mcp-tools.py --check   # CI use, compare the generated result with the committed file
#
# Rules:
# - params whitelist: lists only the parameters MCP exposes; in the spec but not here = deliberately not exposed
#   (see the exclude note of each entry, e.g. servo trim, speech engine/voice/lang).
# - each param is {mcp, openapi, required, desc}, type/enum/minimum/maximum/default
#   are inherited from the matching openapi param schema of the spec by default; write type/enum/minimum/maximum/default only to override.
# - alias: when the mcp name is not the openapi name (time_ms->time, enabled->on, distance_cm->distance,
#   speed_ms->speed), the generator uses the constraints of the spec and the name of MCP; the callTool() side reads the MCP name
#   (see the XiaozhiBridge callTool switch + SonarCenter mcp*()), a thin pass-through call with no repeated validation.
# - required is the required of the MCP schema (LLM view), it can be looser than the spec:
#   LED color/brightness is required in the spec but optional in MCP (no need to fill when preset=stop,
#   enforced by the required_if logic inside callTool, same as the old hand-written behavior).
# - mcp_only: not in the spec, MCP-only parameters (take_photo.question, image_to_text.uuid).
# - description: LLM-facing English, keeps the old hand-written text word for word; to change the text, edit this file and re-gen.
# - openapi: null: no direct HTTP counterpart (play_random_action, get_pir, get_sonar,
#   image_to_text), the schema is described fully by the mcp_only/params of this file.

sync_version: 2.0
generated_from: openapi/open-alpha2-openapi.yml
generator: scripts/generate-mcp-tools.py
output: app/src/main/java/com/open/alpha2/McpToolsGenerated.java

mappings:
  - mcp: self.robot.list_actions
    openapi: /api/action/list
    method: GET
    description: >-
      List all built-in robot actions (id, Chinese and English names). Only needed
      when unsure of the exact name - self.robot.play_action accepts names directly
      with server-side fuzzy matching.
    params: []
    exclude: [panel_token]

  - mcp: self.robot.play_action
    openapi: /api/action/play
    method: GET
    description: >-
      Play a built-in robot action by Chinese or English name (fuzzy-matched
      server-side, e.g. "跳舞" or "dance"). Call self.robot.list_actions first
      if unsure of the exact name. A name that ends in ".ubx" plays that file
      from /sdcard/actions.
    params:
      - mcp: name
        openapi: name
        required: true
        desc: 'Chinese or English action name, e.g. "舉左手" or "take left hand".'
    exclude: [panel_token]
    note: MCP uses the human readable name with fuzzy match (resolveActionId), HTTP uses the exact name

  - mcp: self.robot.stop_action
    openapi: /api/action/stop
    method: POST
    description: Stop whatever action is currently playing.
    params: []
    exclude: [panel_token]

  - mcp: self.robot.play_random_action
    openapi: null
    description: >-
      Play a random filler movement so the robot looks alive; takes no arguments.
      If this turn already plays a specific action via self.robot.play_action, skip
      this one instead of calling both.
    params: []
    note: no direct HTTP counterpart, picks a random action (resolveRandomActionId)

  - mcp: self.robot.servo_set_one
    openapi: /api/servo/one
    method: GET
    description: >-
      Move a single servo to an angle. Ids and valid ranges are specific to this
      robot's build - use small movements when unsure.
    params:
      - mcp: id
        openapi: id
        required: true
        desc: Servo id (1-22).
      - mcp: angle
        openapi: angle
        required: true
        desc: Target angle in degrees.
      - mcp: time_ms
        openapi: time
        required: false
        desc: Movement duration in milliseconds. Default 1000.
    exclude: [trim, panel_token]
    note: trim is deliberately not exposed (written to the EEPROM via cmd12, MCP does not provide it); time_ms alias time

  - mcp: self.robot.servo_set_all
    openapi: /api/servo/all
    method: GET
    description: >-
      Move all servos at once to a full-body pose. angles must have exactly 20
      (servos 1-20) or 22 (servos 1-22) comma-separated integers, one per servo
      id in order.
    params:
      - mcp: angles
        openapi: angles
        required: true
        desc: 20 or 22 comma-separated angle values, e.g. "0,0,0,...".
      - mcp: time_ms
        openapi: time
        required: false
        desc: Movement duration in milliseconds. Default 1000.
    exclude: [panel_token]

  - mcp: self.robot.led_set_head
    openapi: /api/led/head/set
    method: GET
    description: >-
      Set the head LED ring. color 1=red 2=green 3=blue 4=yellow 5=purple 6=cyan
      7=white; brightness 1-9 (default 5); preset long/flash/breathe/chase/dual, or "stop"
      (off; color/brightness ignored).
    params:
      - mcp: preset
        openapi: preset
        required: false
        desc: Effect preset. Default "long".
      - mcp: color
        openapi: color
        required: false
        desc: 1-7, required unless preset=stop.
      - mcp: brightness
        openapi: brightness
        required: false
        desc: 1-9, optional; default 5.
    note: in the spec color/brightness is required, MCP relaxes it to optional (no need to fill when preset=stop, enforced by callTool required_if)
    exclude: [panel_token, speed, p3, p4]

  - mcp: self.robot.led_set_eye
    openapi: /api/led/eye/set
    method: GET
    description: >-
      Set the eye LED ring. Same color/brightness/preset as the head ring, except
      preset "breathe" is unavailable.
    params:
      - mcp: preset
        openapi: preset
        required: false
        desc: Effect preset. Default "long".
      - mcp: color
        openapi: color
        required: false
        desc: 1-7, required unless preset=stop.
      - mcp: brightness
        openapi: brightness
        required: false
        desc: 1-9, optional; default 5.
    exclude: [panel_token, speed, p3, p4]

  - mcp: self.robot.led_set_mouth
    openapi: /api/led/mouth/set
    method: GET
    description: >-
      Set the mouth LED. preset "breathing" pulses at speed 100-1000ms (150=default);
      "off" turns it off. Driven automatically during TTS playback - manual calls
      mid-conversation may conflict.
    params:
      - mcp: preset
        openapi: preset
        required: false
        desc: Default "breathing".
      - mcp: speed_ms
        openapi: speed
        required: false
        desc: Breathing speed 100-1000ms, only used when preset=breathing. Default 150.
    exclude: [panel_token]
    note: v1 wrote the mcp name speed by mistake, the actual code/callTool reads speed_ms (MouthLedData.breathing), v2 corrects it by the code

  - mcp: self.sensors.get_pir
    openapi: null
    description: >-
      Read the last known PIR motion state (most recent event, not a live poll).
      "since" is the ISO time of the last state. A "clear" state with a "note"
      means no motion seen since the app start (no event arrived yet).
    params: []
    note: corresponds to the broadcast query, no HTTP GET, only the WebSocket pir_state

  - mcp: self.sensors.set_pir_enabled
    openapi: /api/pir/set
    method: GET
    description: Turn the PIR motion sensor hardware on or off.
    params:
      - mcp: enabled
        openapi: "on"
        required: true
        desc: true=on, false=off.
    exclude: [panel_token]

  - mcp: self.sensors.get_sonar
    openapi: null
    description: >-
      Read the last known sonar distance in cm plus the trigger threshold (most recent
      reading, not a live poll; -1 if none yet).
    params: []
    note: the reading goes via the WebSocket sonar_distance, the config via /api/servo/sonar

  - mcp: self.sensors.set_sonar_threshold
    openapi: /api/servo/sonar
    method: GET
    description: Configure the sonar obstacle-trigger distance threshold in centimeters.
    params:
      - mcp: distance_cm
        openapi: distance
        required: true
        desc: cm.
    exclude: [panel_token]

  - mcp: self.camera.take_photo
    openapi: /api/camera/snapshot
    method: GET
    description: >-
      Take a photo and get a description of what the robot sees. Optionally pass a
      question to focus the description (e.g. "how many people are there").
    params: []
    exclude: [panel_token]
    mcp_only:
      - mcp: question
        type: string
        required: false
        desc: Optional question to focus the photo description on.
    note: question is MCP-only (used by vision/explain), the HTTP snapshot has no such parameter

  - mcp: self.camera.image_to_text
    openapi: null
    description: >-
      See the most recently captured photo again (from self.camera.take_photo) -
      the image is attached directly, no follow-up needed.
    params: []
    mcp_only:
      - mcp: uuid
        type: string
        required: false
        desc: Accepted but not required; the most recent photo is always returned.
    note: compatibility shim, returns the most recent photo inline directly, does not take a new one; uuid is accepted but not used (a single device always has one latest photo)

  - mcp: self.robot.speak
    openapi: /api/speech/tts
    method: GET
    description: Speak a short phrase out loud through the robot's TTS.
    params:
      - mcp: text
        openapi: text
        required: true
        desc: Text to speak.
    exclude: [engine, voice, lang, pitch, rate, panel_token]
    note: engine/voice/lang/pitch/rate are deliberately not exposed (callTool is fixed to speech_startTTS en_us, same as the old hand-written behavior; the v1 mistaken engine default nuance is removed)

  - mcp: self.media.list_music
    openapi: /api/audio/local_music/list
    method: GET
    description: List all local music files available to play on the robot.
    params: []
    exclude: [panel_token]

  - mcp: self.media.play_music
    openapi: /api/audio/local_music/play
    method: GET
    description: >-
      Play a local music file by song name (fuzzy-matched to filenames). Call
      self.media.list_music first if unsure what's available.
    params:
      - mcp: name
        openapi: name
        required: true
        desc: Song name or filename to play (fuzzy-matched).
    exclude: [panel_token]

  - mcp: self.media.stop_music
    openapi: /api/audio/local_music/stop
    method: GET
    description: Stop whatever local music track is currently playing.
    params: []
    exclude: [panel_token]

  - mcp: self.media.search_radio
    openapi: /api/audio/radio/search
    method: GET
    description: >-
      Search worldwide radio stations by name, city, country, broadcaster or genre.
      Returns matches - then call self.media.play_radio with one of the names
      to play it.
    params:
      - mcp: query
        openapi: query
        required: true
        desc: Search text, e.g. "BBC", "jazz", "Tokyo", "香港電台".
    exclude: [panel_token]

  - mcp: self.media.play_radio
    openapi: /api/audio/radio/play
    method: GET
    description: >-
      Play (or switch to) a radio station by name. Matches a previous
      self.media.search_radio result when possible, otherwise searches directly.
      No need to call self.media.stop_radio first.
    params:
      - mcp: name
        openapi: name
        required: true
        desc: Station name, e.g. "BBC World Service" or "香港電台第一台".
    exclude: [panel_token]

  - mcp: self.media.stop_radio
    openapi: /api/audio/radio/stop
    method: GET
    description: Stop whatever radio station is currently playing.
    params: []
    exclude: [panel_token]
