asyncapi: 2.6.0
info:
  title: Open Alpha2 WebSocket Events
  version: beta 7
  description: |
    WebSocket live event bus (RFC6455) `GET /ws`, driven by `WebSocketServer.java:34` + `EventBus.java` + `RobotEventReceiver.java`.
    All async results of HTTP `/api/*` operations are pushed here, no polling needed. The front end `app-log.js` subscribes to all events.
  contact:
    name: Open Alpha2
    url: https://github.com/arthurson/ubtech-open-alpha2
  license:
    name: GPL-3.0-only
    url: https://www.gnu.org/licenses/gpl-3.0.html
servers:
  alpha2:
    url: ws://{robotIp}:8888/ws
    protocol: websocket
    description: Robot local WebSocket
    variables:
      robotIp:
        default: 192.168.43.185
        description: Robot IP

channels:
  /ws:
    subscribe:
      summary: Subscribe to all live events
      operationId: wsSubscribe
      message:
        $ref: '#/components/messages/EventEnvelope'
    publish:
      summary: Client send (currently used only for ping/keepalive, the business downlink is pushed by the server)
      operationId: wsPublish
      message:
        $ref: '#/components/messages/ClientPing'

components:
  messages:
    EventEnvelope:
      name: EventEnvelope
      title: Generic event envelope
      payload:
        type: object
        required: [type, data]
        properties:
          type:
            type: string
            description: Event type
            enum:
              # 2026-09-14 full re-check against the real EventBus.get().publish(...) calls
              # site (including constant forms such as XiaozhiClient.EVT_STATE) completed, fixed a few
              # names that did not match the code (bt->bt_connection, wifi->wifi_result,
              # mcp_tool_call->xiaozhi_mcp, xiaozhi_status->xiaozhi_state),
              # removed sonar_distance (the code has no such event type, it is only a sonar payload
              # field key, the examples below now use sonar_obstacle) and
              # xiaozhi_chat (the code never published it, now split into
              # six independent events xiaozhi_llm/tts/stt/alert/custom/system, all
              # completed), and added a dozen more events the code has always published but were not listed here.
              - accel
              - action_stop
              - actions_pack
              - alpha2_pir_state
              - asr_partial
              - asr_result
              - authorize
              - battery
              - bt_connection
              - chest_broadcast_debug
              - chest_mute_key
              - chest_rcv
              - chest_upgrade_done
              - chest_upgrade_progress
              - gamepad_axis
              - gamepad_bt
              - gamepad_key
              - gamepad_state
              - gamepad_touch
              - gesture
              - grammar_error
              - grammar_init
              - grammar_result
              - head_key
              - head_key_native
              - head_rcv
              - mic_broadcast_debug
              - mic_state
              - offline_mode
              - qr_code
              - robot_interrupted
              - robot_uuid
              - semantic_match
              - servo_reads
              - servo_stream
              - sonar_obstacle
              - tts_end
              - vosk_download
              - vosk_state
              - volume_changed
              - wakeup
              - wifi_result
              - xiaozhi_activation
              - xiaozhi_alert
              - xiaozhi_custom
              - xiaozhi_llm
              - xiaozhi_mcp
              - xiaozhi_mic_state
              - xiaozhi_state
              - xiaozhi_stt
              - xiaozhi_system
              - xiaozhi_tts
          data:
            type: object
            description: Event payload, varies by type
          ts:
            type: integer
            format: int64
            description: Unix ms
      examples:
        - name: battery
          payload:
            type: battery
            data: { level: 80, scale: 100, charging: false, status: "discharging" }
            ts: 1725710000000
        - name: sonar
          payload:
            type: sonar_obstacle
            data: { triggered: true, thresholdCm: 25 }
        - name: pir
          payload:
            type: alpha2_pir_state
            data: { triggered: true, raw: -109 }
        - name: volume
          payload:
            type: volume_changed
            data: { volume: 6, max: 15 }
        - name: servo_reads
          summary: One cycle of the servo read stream (api/servo/stream/start, alpha2-rl#3). t_ms is SystemClock.elapsedRealtime of the robot. read_ms is first send to last reply (-1 = no reply). A servo that did not answer gives null. accel is the newest accelerometer sample (null while the accelerometer is off).
          payload:
            type: servo_reads
            data: { seq: 42, t_ms: 1234567, read_ms: 9, ids: [2, 3, 5, 6, 17, 18, 19, 20], angles: [201, 149, 96, 123, 106, 116, 158, 119], accel: [0.13, -0.2, 9.4], accel_age_ms: 8 }
        - name: servo_stream
          summary: The servo read stream stopped (stop call, no renew within ttl_ms, error or app shutdown).
          payload:
            type: servo_stream
            data: { running: false, reason: "ttl: no renew in 5000 ms" }
    ClientPing:
      name: ClientPing
      payload:
        type: object
        properties:
          type: { type: string, enum: [ping] }
          ts: { type: integer }

  schemas:
    AsrResult:
      type: object
      properties:
        text: { type: string }
        type: { type: integer, description: "1=grammar, 0=dictation" }
